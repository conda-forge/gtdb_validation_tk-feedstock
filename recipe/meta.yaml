{% set name = "gtdb_validation_tk" %}
{% set version = "0.1.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 19c2a986d86783eb678b245c401a9e0f753e41a066ba2d6b367f1ff2419296aa

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  entry_points:
    - gtdb_validation_tk = gtdb_validation_tk.__main__:main

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy >=1.8.0
    - biolib >=0.1.6
    - dendropy >=4.0.0
    - fuzzywuzzy
    - phylorank >=0.1.0

test:
  imports:
    - gtdb_validation_tk
  commands:
    - gtdb_validation_tk -h

about:
  home: https://github.com/Ecogenomics/gtdb_validation_tk
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: |
    This toolkit provides functionality for validation the GTDB Taxonomy.
    It is primarily intended to be used by the GTDB curation team, but has been
    made available in case others find it useful.

extra:
  recipe-maintainers:
    - aaronmussig
